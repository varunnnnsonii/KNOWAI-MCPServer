version: '3.8'

services:
  mcp-server:
    build: .
    volumes:
      - ./:/changelogs
      - mcp-data:/data
    environment:
      - CHANGELOG_DIR=/changelogs
      - MCP_DATA_DIR=/data
      - LOG_LEVEL=INFO
    # Usually MCP runs over stdio to a client (like Claude Desktop). 
    # If running over SSE, you'd bind ports here.
    # ports:
    #   - "8000:8000"
    # command: ["python", "-m", "src.server", "--transport", "sse", "--port", "8000"]

volumes:
  mcp-data:
